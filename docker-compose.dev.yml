include:
    - ./services/user/docker-compose.dev.yml
    - ./services/chat/docker-compose.dev.yml

services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
            args:
                NEXT_PUBLIC_BASE_USER_SERVICE_API_URL: http://localhost:8080
                NEXT_PUBLIC_BASE_CHAT_SERVICE_API_URL: http://localhost:8081
        volumes:
            - ./frontend:/app
            - /app/node_modules
            - /app/.next
        ports:
            - "3000:3000"
        depends_on:
            - user-api
            - chat-api
